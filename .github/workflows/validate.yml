name: Validate roadmap items

# Gate every change to a roadmap item: fail if any file has a missing/duplicate/
# malformed ID, an invalid product/horizon/stage, a filename that doesn't match
# its ID, or a file in the wrong product folder. Pure file checks — no token.

on:
  pull_request:
    paths:
      - "content/items/**"
  push:
    branches: [main]
    paths:
      - "content/items/**"
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 tooling/validate_items.py
