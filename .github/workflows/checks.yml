name: Check application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: edit-service/go.mod
          cache-dependency-path: edit-service/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Scan Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git . --redact=100 --log-opts=--all
      - run: npm --prefix site ci --no-audit --no-fund
      - run: npm --prefix site audit --audit-level=moderate
      - run: npm --prefix site test
      - run: npm --prefix site run check
      - run: npm --prefix site run build
      - run: node site/scripts/check-document-links.mjs
      - run: node site/scripts/check-demo.mjs
      - run: python3 tooling/validate_items.py
      - name: Check editing service
        working-directory: edit-service
        run: go test -race ./... && go vet ./...
