# Deploy the roadmap site + hosted presentations to canvas-drop.
#
# Ships the FULL INTERNAL build (owners, all items). This is a demonstration
# instance whose content is entirely fictional, so there is nothing to leak. For
# a real portfolio on a publicly reachable canvas, switch to the public build by
# adding `SITE_AUDIENCE: public` to the build step's env (only Public items,
# owners stripped).
#
# Static files only. To use the canvas Backend SDK, first enable Backend + the
# capabilities you need (kv, files, ai, realtime) in the canvas's Backend tab —
# the deploy key can't toggle them.
#
# SECRET: CANVAS_DROP_TOKEN — the per-canvas deploy key (Bearer), stored in repo
# Actions secrets. The canvas id and host below are not secrets.
name: Deploy roadmap site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: canvas-drop-deploy
  cancel-in-progress: true

env:
  CANVAS_ID: 01a0152e-2c0d-726b-9235-298bf5d46ff8
  CANVAS_HOST: roadmapdemo.canvas-drop.com
  SITE_URL: https://roadmapdemo.canvas-drop.com
  SITE_BASE: /
  SITE_AUDIENCE: internal
  PUBLIC_EDIT_API: https://roadmapdemoapi.canvas-drop.com
  PUBLIC_CANVAS_BACKEND: "true"
  ROADMAP_PUBLICATION_PAUSED: ${{ vars.ROADMAP_PUBLICATION_PAUSED }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Select trusted application and capture publication token
        id: coordination
        run: node tooling/deploy/actions-publication.mjs select
        env:
          CANVAS_DROP_TOKEN: ${{ secrets.CANVAS_DROP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
      - uses: ./.github/actions/setup-site
        if: steps.coordination.outputs.full_build == 'true'
      - name: Classify changes since the last verified deployment
        id: changes
        run: node tooling/ci/changes.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Cache item history
        if: steps.coordination.outputs.already_current != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: site/.cache/item-history.json
          key: history-${{ runner.os }}-${{ hashFiles('site/scripts/build-item-history.mjs', 'site/src/lib/itemHistory.server.ts') }}-${{ github.sha }}
          restore-keys: history-${{ runner.os }}-${{ hashFiles('site/scripts/build-item-history.mjs', 'site/src/lib/itemHistory.server.ts') }}-
      - name: Validate content
        if: steps.coordination.outputs.full_build == 'true'
        run: python3 tooling/validate_items.py

      # Full internal build. Served at the canvas subdomain root, so base = "/".
      - name: Build the roadmap site
        if: steps.coordination.outputs.full_build == 'true'
        working-directory: site
        run: npm run build

      - name: Verify source document links
        if: steps.coordination.outputs.full_build == 'true'
        run: node site/scripts/check-document-links.mjs
      - name: Verify published item dates
        if: steps.coordination.outputs.full_build == 'true'
        run: node site/scripts/check-item-history.mjs

      - name: Verify fictional demo content
        if: steps.coordination.outputs.already_current != 'true'
        run: node site/scripts/check-demo.mjs

      - name: Prepare content using the verified application package
        if: steps.coordination.outputs.full_build != 'true' && steps.coordination.outputs.already_current != 'true'
        run: node tooling/deploy/actions-publication.mjs prepare

      - name: Bind the full build to its canonical application identity
        id: application
        if: steps.coordination.outputs.full_build == 'true'
        run: node tooling/deploy/actions-publication.mjs bind-full

      # The public demo retains its secret-history scan for every release.
      - name: Require successful application checks before publishing
        run: node tooling/ci/changes.mjs wait
        env:
          GH_TOKEN: ${{ github.token }}

      # This is private executable build tooling, never part of the Canvas
      # manifest. Consumers also require this entire main workflow to succeed.
      - name: Store canonical private application package
        if: steps.coordination.outputs.full_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roadmap-application-${{ steps.application.outputs.application_digest }}
          path: ${{ steps.application.outputs.application_directory }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Deploy to canvas-drop
        env:
          CANVAS_DROP_TOKEN: ${{ secrets.CANVAS_DROP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node tooling/deploy/actions-publication.mjs publish

      - name: Record verified deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployment-verification
          path: deployment-verification.json
