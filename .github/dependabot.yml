version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # 7.5.0 breaks the tested typo-tolerant search behavior. Revisit newer releases.
      - dependency-name: fuse.js
        versions: ["7.5.0"]
  - package-ecosystem: gomod
    directory: /edit-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
